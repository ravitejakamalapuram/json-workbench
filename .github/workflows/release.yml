name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Verify tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "${RELEASE_TAG#v}" = "$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run build:cli
      - run: npm run test:cli
      - run: npm run build:vscode
      - run: npm run package:check
      - name: Create extension archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: zip -qr "json-workbench-extension-${RELEASE_TAG}.zip" apps/extension/dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" "json-workbench-extension-${RELEASE_TAG}.zip" --verify-tag --generate-notes --title "$RELEASE_TAG"
