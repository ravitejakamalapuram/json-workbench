name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Release-platform PR check: validate release.yaml, run `test`, build + package the
  # Chrome zip exactly as a release would (no secrets, no id-token).
  ci:
    permissions:
      contents: read
      actions: read # lets app-ci.yml find which release-platform commit it runs at
    uses: ravitejakamalapuram/release-platform/.github/workflows/app-ci.yml@v2

  # Repo-specific gate the platform does not cover: dependency audit, CLI and
  # VS Code builds, and the package check.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: npm run build:cli
      - run: npm run test:cli
      - run: npm run build:vscode
      - run: npm run package:check

  # AppForge AI factory checks: permission-diff PR comment + secret scanning.
  appforge-checks:
    permissions:
      contents: read
      pull-requests: write
    uses: ravitejakamalapuram/appforge-kit/.github/workflows/checks.yml@main
    with:
      manifest-path: apps/extension/dist/manifest.json

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.63.0
      - run: pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: python3 tests/smoke_extension.py
