name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Release-platform PR check: validate release.yaml, run `test`, build + package the
  # Chrome zip exactly as a release would (no secrets, no id-token).
  ci:
    permissions:
      contents: read
      actions: read # lets app-ci.yml find which release-platform commit it runs at
    uses: ravitejakamalapuram/release-platform/.github/workflows/app-ci.yml@v2

  # Repo-specific gate the platform does not cover: dependency audit, CLI and
  # VS Code builds, and the package check.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: npm run build:cli
      - run: npm run test:cli
      - run: npm run build:vscode
      - run: npm run package:check

  # AppForge AI factory checks: permission-diff PR comment + secret scanning.
  appforge-checks:
    permissions:
      contents: read
      pull-requests: write
    uses: ravitejakamalapuram/appforge-kit/.github/workflows/checks.yml@main
    with:
      manifest-path: apps/extension/dist/manifest.json

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.63.0
      - run: pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: python3 tests/smoke_extension.py

  # Tell the AppForge factory (Paperclip) about the two events an agent should act on:
  # a PR opened for review, and CI failing on main. Deliberately NOT every push - each
  # notification wakes an agent and spends budget. Needs the PAPERCLIP_WEBHOOK_URL and
  # PAPERCLIP_WEBHOOK_SECRET Actions secrets; see appforge-control/infra/cloudflare-tunnel.
  notify-pr-opened:
    if: github.event_name == 'pull_request' && github.event.action == 'opened' && !github.event.pull_request.draft
    needs: [ci, quality, appforge-checks, smoke]
    uses: ravitejakamalapuram/appforge-kit/.github/workflows/notify-paperclip.yml@main
    with:
      event: pr_opened
      product: json-workbench
      idempotency-key: json-workbench:pr_opened:${{ github.event.pull_request.number }}
      details-json: '{"pr": ${{ github.event.pull_request.number }}, "ci": "${{ needs.ci.result }}/${{ needs.quality.result }}/${{ needs.smoke.result }}"}'
    secrets:
      paperclip-webhook-url: ${{ secrets.PAPERCLIP_WEBHOOK_URL }}
      paperclip-webhook-secret: ${{ secrets.PAPERCLIP_WEBHOOK_SECRET }}

  notify-main-failed:
    if: always() && github.event_name == 'push' && (needs.ci.result == 'failure' || needs.quality.result == 'failure' || needs.smoke.result == 'failure')
    needs: [ci, quality, appforge-checks, smoke]
    uses: ravitejakamalapuram/appforge-kit/.github/workflows/notify-paperclip.yml@main
    with:
      event: ci_failed
      product: json-workbench
      idempotency-key: json-workbench:ci_failed:${{ github.sha }}
      details-json: '{"ci": "${{ needs.ci.result }}", "quality": "${{ needs.quality.result }}", "smoke": "${{ needs.smoke.result }}"}'
    secrets:
      paperclip-webhook-url: ${{ secrets.PAPERCLIP_WEBHOOK_URL }}
      paperclip-webhook-secret: ${{ secrets.PAPERCLIP_WEBHOOK_SECRET }}
