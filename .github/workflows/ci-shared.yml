name: Shared Chrome Extension CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chrome-extension-ci:
    uses: ravitejakamalapuram/.github-workflows-shared/.github/workflows/chrome-extension-ci.yml@v1
    with:
      # Validate/package the built extension (Vite output), not the source tree.
      extension-dir: apps/extension/dist
      build-command: npm run build
      node-version: "22"
      manifest-version: "3"
      strict-mode: "true"
      # ESLint ignores **/dist/**; the CI workflow already runs `npm run lint` on the repo.
      run-lint: false
      run-unit-tests: true
      run-e2e-tests: true
      e2e-test-script: tests/smoke_extension.py
