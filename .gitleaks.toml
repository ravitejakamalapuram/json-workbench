# Gitleaks reads this file from the checked-out head when CI scans a pull request.
# It extends the default rules and allows only the public, unsigned-or-demo JWT
# fixtures that tests use to exercise JWT detection; they grant access to nothing.
[extend]
useDefault = true

[allowlist]
description = "Demo JWT fixtures in tests"
regexes = [
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U''',
]
