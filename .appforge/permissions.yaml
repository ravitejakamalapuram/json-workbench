schema: appforge/permissions@1
# Changed in the UI rebuild (ADR 0005): the optional debugger permission and the
# credentialed re-fetch of the tab URL are gone; tab import reads the rendered page
# text through scripting, and network bodies come from a DevTools panel instead.
permissions:
  - permission: activeTab
    required: true
    reason: "Read the text of the tab in front when the user presses 'Import active tab' (granted by clicking the toolbar icon on that tab). The text is read from the page through scripting; the URL is never requested again."
    data_access: [tab_url, tab_content_user_triggered]
    security_impact: low
  - permission: sidePanel
    required: true
    reason: "Show the workbench UI in Chrome's side panel"
    data_access: []
    security_impact: low
  - permission: storage
    required: true
    reason: "chrome.storage.local keeps the settings, recent file names and the working transform pipeline (keys listed in PRIVACY.md, removed by 'Clear local data'); chrome.storage.session holds one 'Open in Workbench' handoff from the in-page viewer for at most 60 s. Both areas are restricted to trusted extension contexts."
    data_access: [user_settings_local, handoff_session]
    security_impact: low
  - permission: scripting
    required: true
    reason: "Read the rendered JSON text of the active tab on explicit import, and register the opt-in in-page viewer only for the origins the user granted"
    data_access: [tab_content_user_triggered]
    security_impact: medium
  - permission: "<all_urls>"
    required: false
    reason: "Optional host permission, requested from a click: 'Allow on this site' asks for that one origin (https://<host>/*), 'Auto-render on all pages' asks for <all_urls>. The in-page viewer is registered only for granted origins and turns off when the grant is revoked."
    data_access: [any_site_content_opt_in]
    security_impact: high
