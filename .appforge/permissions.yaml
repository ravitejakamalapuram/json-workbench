schema: appforge/permissions@1
# First release (docs/design/DECISIONS.md, "First release scope"): the extension reads
# no web page and no tab, so it declares no host access, no content script and no
# DevTools page. The side panel and local storage are all it needs. The activeTab,
# scripting, optional all-sites and debugger entries of earlier versions are gone with
# the features that used them (tab import, the in-page viewer, network capture).
permissions:
  - permission: sidePanel
    required: true
    reason: "Show the workbench UI in Chrome's side panel; the toolbar icon opens it (the service worker sets openPanelOnActionClick). 'Open in full tab' opens the same page in a tab through chrome.tabs.create, which needs no permission."
    data_access: []
    security_impact: low
  - permission: storage
    required: true
    reason: "chrome.storage.local keeps the theme, the memory limit, the names, sizes and times of the last 10 files opened (never their content) and the one-time review-note flags (keys listed in PRIVACY.md, removed by 'Clear local data'). The area is restricted to trusted extension contexts."
    data_access: [user_settings_local]
    security_impact: low
